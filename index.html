    <style>

body {
			margin: 0;
			padding: 0;
			background: whitesmoke;
			font-family: "Noto Sans", sans-serif;
			color: #3d3d3d;
		}

		h1 {
			position: absolute;
			margin-top: 0;

    <script src="https://unpkg.com/leaflet@1.7.0/dist/leaflet.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet-ajax/2.1.0/leaflet.ajax.min.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.1.0/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chroma-js/1.3.4/chroma.min.js"></script>

  </head>
<body>

    <div id='map'></div>
    <div class='legend'></div>

<h1> Flood and Fire: Hurricane Helene's connection to Spring Wildfires</h1>


    <script>

      // 1. Map object and baselayer
      var map = L.map('map').setView([36.14, -80.7], 7); //latlong coordinates centered over US
      L.tileLayer('http://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png').addTo(map);

      // 2. variables
      var grades = [0,5,10,15,20,30,35];

      // color scale
      var colors = chroma.scale('Blues').colors(grades.length);
      // color based on class
      function getColor(d) {
            for (var i = 0; i < grades.length - 1; i++) {
            if ( d > grades[i] && d < grades[i+1] ) return colors[i];
            }
            if (d > grades[grades.length - 1]) return colors[grades.length];
      }

      //styling
      function style(feature) {
      return {
            weight: 2,
            opacity: 1,
            color: 'grey',
            dashArray: '3',
            fillOpacity: 0.7,
            fillColor: getColor(feature.properties.Rainfall)
      };
      }

      // 3. States
      var geojson = null;
      var info = L.control();
      info.onAdd = function (map) {
          this._div = L.DomUtil.create('div', 'info');
          this.update();
          return this._div;
      };

      // prop display
      info.update = function (props) {
            this._div.innerHTML = '<h4>Rainfall for September, 2024</h4>' +  (props ?
            '<b>' + props.County + '</b><br />' + props.Rainfall + ' in.'
            : 'Hover over a state');
      };

      info.addTo(map);


      function highlightFeature(e) {
                  var layer = e.target;
                  layer.setStyle({
                  weight: 8,
                  opacity: 0.8,
                  color: '#e3e3e3',
                  fillColor: '#1c5ee3',
                  fillOpacity: 0.5
                  });
                  layer.bringToFront();
                  info.update(layer.feature.properties);
                  }

  function resetHighlight(e) {
                  geojson.resetStyle(e.target);
                  info.update();  
                  }

    function zoomToFeature(e) {
                  map.fitBounds(e.target.getBounds());
                  }

    function onEachFeature(feature, layer) {
                  layer.on({
                  mouseover: highlightFeature,
                  click: zoomToFeature,
                  mouseout: resetHighlight
                  });
                  }


      //3 states GeoJSON layer
      geojson = L.geoJson.ajax("assets/NC_counties_rain.geojson", {
          style: style,
          onEachFeature: onEachFeature
      }).addTo(map);

      //changing the images
      var fireIcon = L.icon({
    iconUrl: 'assets/fire.png',
    iconSize: [28,28],
    iconAnchor: [13,5],
});
      
      //wildfire points

      var wildfireLayer = L.geoJson.ajax("assets/wildfirepoints.geojson", {
  pointToLayer: function (feature, latlng) {
    return L.marker(latlng, { icon: fireIcon });
  },
  onEachFeature: function (feature, layer) {
    layer.bindPopup(
      "<h3>" + feature.properties.name + "</h3><p>" + feature.properties.size + "</p>",
      { maxWidth: "auto" }
    );
  }
}).addTo(map);



      // 4. the legend      

var labels = [];

  
      for (var i = 0; i < grades.length - 1; i++) {
          labels.push('<i style="background:' + colors[i] + '"></i> ' + grades[i] + ' - ' + grades[i + 1]);
      }

      labels.push('<i style="background:' + colors[grades.length - 1] + '"></i> ' + grades[grades.length - 1] + ' +');
      $(".legend").html(labels.join('<br>'));


      // 5. Credits

      map.attributionControl.addAttribution('Population data &copy; <a href="http://census.gov/">US Census Bureau</a> | This map is made by R. Park');

    </script>

</body>
</html>
